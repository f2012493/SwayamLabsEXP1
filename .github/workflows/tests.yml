name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run pytest -q
      - name: Error-budget study still runs
        run: uv run python -m swayam.studies.error_budget --poses 50 --draws 100
