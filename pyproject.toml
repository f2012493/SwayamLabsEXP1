[project]
name = "swayam"
version = "0.1.0"
description = "Swayam Labs: machines making machines, starting from an SO-101 arm."
requires-python = ">=3.12,<3.13"  # lerobot (placo kinematics) needs 3.12+
dependencies = [
    "mcp>=1.2,<2",  # 2.x renamed FastMCP -> MCPServer; migrate deliberately later
    "mujoco>=3.1",
    "numpy",
    "lerobot[kinematics]>=0.6.1",  # placo FK/IK for move_gripper_to (sim and real); docs/LANDSCAPE.md s1
]

[project.optional-dependencies]
# Real arm (install when the SO-101 arrives): uv sync --extra real
real = ["lerobot[feetech]"]
# Parametric CAD for coupons and fixtures: uv sync --extra cad
cad = ["cadquery>=2.4"]

[project.scripts]
swayam-arm-mcp = "swayam.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swayam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
